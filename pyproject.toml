[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pic-snc"
version = "0.1.0"
description = "PIC-SNC v0.1 — Sistema Nervoso Cognitivo para Agentes de IA (PoC Local)"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "SNC-IA Engineering" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.7.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --strict-markers"
